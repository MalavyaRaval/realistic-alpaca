name: ABEV Daily Summary

on:
  schedule:
    # 20:10 UTC covers EDT close+buffer (16:00 ET), 21:10 covers EST
    # close+buffer. Whichever one lands after the actual close wins;
    # the other just reports an incomplete day and gets overwritten.
    - cron: '10 20,21 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: abev-daily-summary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading_system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build daily summary
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
        run: |
          mkdir -p summaries
          python daily_summary_run_once.py | tee "summaries/$(date -u +%Y-%m-%d).txt"

      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add summaries/
          git diff --cached --quiet || git commit -m "daily summary $(date -u +%Y-%m-%d)"
          git push
